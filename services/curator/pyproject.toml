[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "feed-passport-curator"
version = "0.1.0"
description = "Capability-aware Strands agent for portable social-feed intent"
requires-python = ">=3.13"
dependencies = [
  "bedrock-agentcore>=1,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "strands-agents>=1,<2",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.25,<5",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1,<2",
]

[project.scripts]
feed-passport-api = "feed_passport.api.cli:main"
feed-passport-agentcore = "feed_passport.runtime.agentcore_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["../.."]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
